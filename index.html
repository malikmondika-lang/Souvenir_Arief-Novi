<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Tamu VIP - Arief & Novi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #fcf9f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
            border: 2px solid #d4af37;
        }
        /* Animasi Centang */
        .success-checkmark {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            position: relative;
        }
        .success-checkmark .check-icon {
            width: 80px;
            height: 80px;
            position: relative;
            border-radius: 50%;
            box-sizing: content-box;
            border: 4px solid #4CAF50;
            background: #fff;
            animation: scaleCheck 0.3s ease-out forwards;
        }
        .success-checkmark .check-icon::before {
            top: 3px;
            left: -2px;
            width: 30px;
            transform-origin: 100% 50%;
            border-radius: 100px 0 0 100px;
        }
        .success-checkmark .check-icon::after {
            top: 0;
            left: 30px;
            width: 60px;
            transform-origin: 0 50%;
            border-radius: 0 100px 100px 0;
            animation: rotateCheck 4.25s ease-in;
        }
        .success-checkmark .check-icon .icon-line {
            height: 5px;
            background-color: #4CAF50;
            display: block;
            border-radius: 2px;
            position: absolute;
            z-index: 10;
        }
        .success-checkmark .check-icon .icon-line.line-tip {
            top: 46px;
            left: 14px;
            width: 25px;
            transform: rotate(45deg);
            animation: drawTip 0.4s ease-out forwards;
        }
        .success-checkmark .check-icon .icon-line.line-long {
            top: 38px;
            right: 8px;
            width: 47px;
            transform: rotate(-45deg);
            animation: drawLong 0.8s ease-out forwards;
        }
        
        @keyframes drawTip {
            0% { width: 0; left: 1px; top: 19px; }
            100% { width: 25px; left: 14px; top: 46px; }
        }
        @keyframes drawLong {
            0% { width: 0; right: 46px; top: 54px; }
            100% { width: 47px; right: 8px; top: 38px; }
        }
        @keyframes scaleCheck {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* Tipografi */
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-top: 25px;
            margin-bottom: 10px;
        }
        .badge {
            display: inline-block;
            background-color: #d4af37;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        p.couple-name {
            color: #7f8c8d;
            font-size: 16px;
            font-style: italic;
            border-top: 1px solid #eee;
            padding-top: 15px;
            margin-top: 10px;
        }
        .highlight {
            color: #d4af37;
            font-weight: bold;
            font-size: 18px;
            font-style: normal;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ikon Animasi Sukses -->
        <div class="success-checkmark">
            <div class="check-icon">
                <span class="icon-line line-tip"></span>
                <span class="icon-line line-long"></span>
            </div>
        </div>

        <h1>Verifikasi Berhasil!</h1>
        <div class="badge">TAMU SPESIAL (VIP)</div>
        
        <p>Souvenir eksklusif siap diberikan.</p>
        
        <p class="couple-name">
            Pernikahan <br>
            <span class="highlight">Arief Wibowo & Novi</span>
        </p>
    </div>

</body>
</html>
